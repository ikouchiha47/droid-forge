name: Build APK

on:
  push:
    branches:
      - 'app/**'
      - 'skeleton'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Run unit tests
        run: cd android && ./gradlew testDebugUnitTest --console=plain

  build:
    runs-on: ubuntu-latest
    needs: test
    # Only build an APK for app/* branches — skeleton itself is not installable
    if: startsWith(github.ref, 'refs/heads/app/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" | grep -v "^\[=" || true
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --console=plain
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
